<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90" width="800" height="90" role="img" aria-label="Animated heartbeat line" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <style>
      .trace { stroke-dasharray: 260 1740; stroke-dashoffset: 260; animation: sweep 3.2s linear infinite; }
      @keyframes sweep { to { stroke-dashoffset: -1740; } }
      .dot { animation: pulse 1.6s ease-in-out infinite; transform-origin: 400px 45px; }
      @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>
  <path pathLength="2000" fill="none" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M0 45 H180 L195 45 L210 20 L228 70 L246 30 L258 45 H430 L445 45 L460 12 L480 78 L500 28 L512 45 H800"/>
  <path class="trace" pathLength="2000" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        d="M0 45 H180 L195 45 L210 20 L228 70 L246 30 L258 45 H430 L445 45 L460 12 L480 78 L500 28 L512 45 H800"/>
</svg>
